name: TrueCursor CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend & Core Tests (Python 3.12)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install system libraries for OpenCV and MediaPipe
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install backend and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run pytest suite
        env:
          TTS_ENABLED: "0"
          GAZE_BACKEND: "mediapipe"
        run: pytest -v

      - name: Verify FastAPI and sidecar imports
        run: |
          python -c "from backend.api.main import app; assert app.title == 'TrueCursor API'"
          python -c "import backend.sidecar_main"

  frontend-checks:
    name: Frontend Typecheck & Production Build (Node 22)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: TypeScript typecheck
        run: npm --prefix frontend run typecheck

      - name: Vite production build
        run: npm --prefix frontend run build
