[package]
name = "clearcursor-desktop"
version = "0.2.0"
description = "ClearCursor motor stabilization, gaze control, and clinician telemetry desktop app"
authors = ["ClearCursor Contributors"]
edition = "2021"

[lib]
name = "clearcursor_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-shell = "2"
