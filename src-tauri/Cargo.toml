[package]
name = "truecursor-desktop"
version = "0.1.0"
description = "TrueCursor Parkinson's motor stabilization and gaze tracking desktop app"
authors = ["TrueCursor Team"]
edition = "2021"

[lib]
name = "truecursor_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-shell = "2"
